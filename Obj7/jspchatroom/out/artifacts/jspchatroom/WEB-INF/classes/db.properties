# =====================================================================
# 实验 07：H2 文件数据库连接配置（UTF-8 编码）
# 格式为 Java Properties；# 开头为注释。
# ---------------------------------------------------------------------
# 数据库文件放在项目内新建的 db 文件夹中：
#   jspchatroom/db/chatroom.mv.db
# 该目录不存在时，DBUtil 会自动创建（H2 也会按需创建）。
#
# 注意：
#   1. H2 的 file: 后面是“文件路径”，这里写成绝对路径，避免受
#      Tomcat 工作目录（通常是 <Tomcat>/bin）影响。
#   2. 如果项目换了位置（换电脑、换目录），只需改下面这一行。
#   3. 想清空所有数据：停掉 Tomcat，删除 db 目录下的 chatroom.mv.db 即可，
#      下次启动会重新建库建表。
#   4. ~ 代表当前用户主目录（H2 会把 ~ 替换成 user.home），可自行改用。
# =====================================================================

jdbc.url=jdbc:h2:file:C:/Users/zhang/Desktop/上课/Jakarta/EE/Obj7/jspchatroom/db/chatroom
jdbc.user=sa
jdbc.password=
